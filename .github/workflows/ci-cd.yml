name: Wisecow CI/CD

on:
  push:
    branches:
      - main

jobs:
  ci-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 1: Build the application (for bash, we validate the script permissions and paths)
    - name: Build and Prepare Application
      run: |
        echo "Building and validating Wisecow application..."
        chmod +x wisecow.sh
        echo "Build phase complete."

    # Step 2: Run the unit test
    - name: Install dependencies for Unit Tests
      run: |
        sudo apt-get update
        sudo apt-get install -y cowsay fortune-mod netcat-openbsd

    - name: Run Unit Tests
      run: |
        ./tests/test_wisecow.sh

    # Step 3: Login to Docker Hub
    - name: Log in to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_HUB_USERNAME }}
        password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

    # Step 4: Generate unique version tag (e.g. v1.0.12)
    - name: Generate Unique Version Tag
      id: versioning
      run: |
        VERSION_TAG="v1.0.${{ github.run_number }}"
        echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
        echo "Generated version: $VERSION_TAG"

    # Step 5 & 6: Build & Push the Docker image with the unique tag version method
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_HUB_USERNAME }}/wisecow:latest
          ${{ secrets.DOCKER_HUB_USERNAME }}/wisecow:${{ env.VERSION_TAG }}

  cd-pipeline-test:
    needs: ci-pipeline
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Create Kind Cluster using helm/kind-action
    - name: Create Kind Cluster
      uses: helm/kind-action@v1.8.0
      with:
        config: kind-config.yaml
        cluster_name: wisecow-cluster

    # Build and load local image to Kind cluster to verify it works
    - name: Build and Load Docker Image
      run: |
        docker build -t wisecow:latest .
        kind load docker-image wisecow:latest --name wisecow-cluster

    # Deploy Nginx Ingress
    - name: Install NGINX Ingress Controller
      run: |
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml
        echo "Waiting for Ingress Controller to become ready..."
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=180s

    # Create the TLS secret
    - name: Create TLS Secret
      run: |
        kubectl create secret tls wisecow-tls --cert=certs/tls.crt --key=certs/tls.key

    # Deploy Wisecow manifests
    - name: Deploy wisecow manifests
      run: |
        kubectl apply -f k8s/
        echo "Waiting for Wisecow deployment to be ready..."
        kubectl rollout status deployment/wisecow --timeout=120s

    # Verify connection over TLS
    - name: Verify application TLS access
      run: |
        echo "Testing connection to HTTPS wisecow.local via Ingress..."
        curl -k -v --resolve wisecow.local:443:127.0.0.1 https://wisecow.local/
